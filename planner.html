<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Planner</title>
<meta name="theme-color" content="#35476b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Planner" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2335476b'/%3E%3Crect x='18' y='18' width='64' height='64' rx='10' fill='%23f4f1ec'/%3E%3Crect x='18' y='18' width='64' height='20' rx='10' fill='%23c04863'/%3E%3Crect x='18' y='28' width='64' height='10' fill='%23c04863'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2335476b'/%3E%3Crect x='18' y='18' width='64' height='64' rx='10' fill='%23f4f1ec'/%3E%3Crect x='18' y='18' width='64' height='20' rx='10' fill='%23c04863'/%3E%3Crect x='18' y='28' width='64' height='10' fill='%23c04863'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#f4f1ec;
    --card:#ffffff;
    --header:#35476b;
    --header-text:#f4f1ec;
    --today:#c04863;
    --binge:#e13d3d;
    --pink:#ec6fa6;
    --amber:#f2a93c;
    --green:#3fa66a;
    --blue:#3d6fd1;
    --black:#242424;
    --note:#6b5b73;
    --bell-on:#ffd400;
    --bell-off:#8b8b8b;
    --num:#3c3c3c;
    --muted:#8b8b8b;
    --mon:#b7cbe0;
    --tue:#b3cdcb;
    --wed:#bcaebb;
    --thu:#a6aed6;
    --fri:#e6b7c1;
    --sat:#e8b9c3;
    --sun:#d7cdc4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%;
    margin:0;
    overscroll-behavior:none;
    touch-action:manipulation;
  }
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    flex-direction:column;
    height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    user-select:none;
  }
  header{
    background:var(--header);
    color:var(--header-text);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 8px;
    flex-shrink:0;
  }
  header button{
    background:none;
    border:none;
    color:var(--header-text);
    font-size:22px;
    width:44px;
    height:44px;
    line-height:44px;
    cursor:pointer;
  }
  header h1{
    margin:0;
    font-size:17px;
    font-weight:600;
    letter-spacing:.02em;
    cursor:pointer;
  }
  .header-center{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .bell-btn{
    background:none;
    border:none;
    padding:0;
    width:20px;
    height:20px;
    color:var(--bell-off);
    cursor:pointer;
    flex-shrink:0;
  }
  .bell-btn svg{ width:100%; height:100%; fill:currentColor; display:block; }
  .bell-btn.active{ color:var(--bell-on); }
  .weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    flex-shrink:0;
  }
  .weekdays span{
    text-align:center;
    font-size:11px;
    font-weight:600;
    color:var(--muted);
    padding:6px 0;
  }
  .grid{
    flex:1;
    display:grid;
    grid-template-columns:repeat(7,1fr);
    grid-template-rows:repeat(6,1fr);
    gap:2px;
    padding:2px;
    min-height:0;
  }
  .cell{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    padding:6px;
    border-radius:10px;
    background:var(--bg);
    cursor:pointer;
    overflow:hidden;
  }
  .cell.in span.num{color:var(--num);}
  .cell.out{opacity:.35;}
  .cell:nth-child(7n+1){background:var(--mon);}
  .cell:nth-child(7n+2){background:var(--tue);}
  .cell:nth-child(7n+3){background:var(--wed);}
  .cell:nth-child(7n+4){background:var(--thu);}
  .cell:nth-child(7n+5){background:var(--fri);}
  .cell:nth-child(7n+6){background:var(--sat);}
  .cell:nth-child(7n+7){background:var(--sun);}
  .cell span.num{
    font-size:14px;
    font-weight:500;
    width:24px;
    height:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
  }
  .cell.today span.num{
    background:var(--today);
    color:#fff;
    font-weight:700;
  }
  .marks{
    display:flex;
    flex-wrap:wrap;
    gap:2px;
    justify-content:flex-end;
    margin-top:auto;
  }
  .dot{
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--header);
    opacity:.6;
  }
  .dot.binge{ background:var(--binge); opacity:1; }
  .dot.pink{ background:var(--pink); opacity:1; }
  .dot.amber{ background:var(--amber); opacity:1; }
  .dot.green{ background:var(--green); opacity:1; }
  .dot.blue{ background:var(--blue); opacity:1; }
  .dot.black{ background:var(--black); opacity:1; }
  .dot.note{
    background:var(--note);
    opacity:1;
  }

  .backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
    z-index:10;
  }
  .backdrop.open{opacity:1; pointer-events:auto;}

  .sheet{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:var(--card);
    border-radius:18px 18px 0 0;
    padding:10px 18px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform .25s ease;
    z-index:11;
    max-height:70vh;
    display:flex;
    flex-direction:column;
  }
  .sheet.open{transform:translateY(0);}
  .sheet-handle{
    width:36px;
    height:4px;
    border-radius:2px;
    background:#ddd;
    margin:4px auto 12px;
    flex-shrink:0;
  }
  .sheet-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-shrink:0;
    margin-bottom:10px;
  }
  .sheet-top h2{
    margin:0;
    font-size:16px;
    font-weight:600;
    color:var(--num);
  }
  .sheet-close{
    background:none;
    border:none;
    font-size:20px;
    color:var(--muted);
    cursor:pointer;
    width:32px;
    height:32px;
  }
  .sheet-actions{
    display:flex;
    align-items:center;
    gap:2px;
  }
  .icon-btn{
    background:none;
    border:none;
    cursor:pointer;
  }
  .notes-icon{
    width:18px;
    height:18px;
    border-radius:4px;
    background:var(--note);
    opacity:.85;
    padding:0;
  }
  #notes-back{
    font-size:20px;
    color:var(--muted);
    width:32px;
    height:32px;
    margin-bottom:6px;
  }
  #notes-view{
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:0;
  }
  #notes-view[hidden]{ display:none; }
  #lock-panel{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    padding:30px 0;
  }
  #lock-panel[hidden]{ display:none; }
  #pin-input{
    width:120px;
    text-align:center;
    letter-spacing:14px;
    font-size:20px;
    border:1px solid #ddd;
    border-radius:10px;
    padding:10px 0 10px 14px;
    background:var(--bg);
  }
  #pin-input.error{
    border-color:var(--binge);
    animation:shake .3s;
  }
  #pin-hint{
    font-size:11px;
    color:var(--muted);
    height:12px;
    margin:0;
  }
  #forgot-btn{
    background:none;
    border:none;
    color:var(--muted);
    font-size:15px;
    cursor:pointer;
    margin-top:6px;
  }
  @keyframes shake{
    25%{ transform:translateX(-6px); }
    75%{ transform:translateX(6px); }
  }
  #notes-text{
    flex:1;
    min-height:120px;
    resize:none;
    border:1px solid #ddd;
    border-radius:10px;
    padding:10px;
    font-size:14px;
    font-family:inherit;
    background:var(--bg);
    color:var(--num);
  }
  .log-row{
    display:flex;
    align-items:center;
    padding-bottom:12px;
    margin-bottom:8px;
    border-bottom:1px solid #eee;
    flex-shrink:0;
  }
  .log-btn{
    width:26px;
    height:26px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    padding:0;
    background:conic-gradient(var(--binge) 0 60deg, var(--pink) 60deg 120deg, var(--amber) 120deg 180deg, var(--green) 180deg 240deg, var(--blue) 240deg 300deg, var(--black) 300deg 360deg);
  }

  .dialog-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
    z-index:20;
  }
  .dialog-backdrop.open{ opacity:1; pointer-events:auto; }
  .dialog{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.9);
    background:var(--card);
    border-radius:16px;
    padding:20px;
    width:260px;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
    z-index:21;
  }
  .dialog.open{
    opacity:1;
    pointer-events:auto;
    transform:translate(-50%,-50%) scale(1);
  }
  .swatches{
    display:flex;
    justify-content:space-between;
  }
  .swatch{
    width:30px;
    height:30px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    padding:0;
  }
  .swatch.red{ background:var(--binge); }
  .swatch.pink{ background:var(--pink); }
  .swatch.amber{ background:var(--amber); }
  .swatch.green{ background:var(--green); }
  .swatch.blue{ background:var(--blue); }
  .swatch.black{ background:var(--black); }
  .tally{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:16px;
    min-height:10px;
  }
  .tally span{
    width:9px;
    height:9px;
    border-radius:50%;
    cursor:pointer;
  }

  #reminder-list{
    list-style:none;
    margin:0;
    padding:0;
    overflow-y:auto;
    flex:1;
  }
  #reminder-list li{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid #eee;
  }
  #reminder-list input[type="checkbox"]{
    width:18px;
    height:18px;
    flex-shrink:0;
    accent-color:var(--bell-on);
  }
  #reminder-list .rtext{
    flex:1;
    font-size:14px;
    color:var(--num);
  }
  #reminder-list li.done .rtext{
    text-decoration:line-through;
    color:var(--muted);
  }
  #reminder-list .remove{
    background:none;
    border:none;
    color:var(--muted);
    font-size:18px;
    cursor:pointer;
    width:28px;
    height:28px;
    flex-shrink:0;
  }
  #reminder-form{
    display:flex;
    gap:8px;
    padding-top:12px;
    flex-shrink:0;
  }
  #reminder-form input[type="text"]{
    flex:1;
    min-width:0;
    border:1px solid #ddd;
    border-radius:10px;
    padding:8px 10px;
    font-size:14px;
    background:var(--bg);
  }
  #reminder-form button{
    width:38px;
    height:38px;
    border-radius:50%;
    border:none;
    background:var(--header);
    color:#fff;
    font-size:20px;
    cursor:pointer;
    flex-shrink:0;
  }
  #appt-list{
    list-style:none;
    margin:0;
    padding:0;
    overflow-y:auto;
    flex:1;
  }
  #appt-list li{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid #eee;
  }
  #appt-list .time{
    font-size:13px;
    font-weight:700;
    color:var(--today);
    flex-shrink:0;
    width:70px;
  }
  #appt-list .name{
    flex:1;
    font-size:14px;
    color:var(--num);
  }
  #appt-list .remove{
    background:none;
    border:none;
    color:var(--muted);
    font-size:18px;
    cursor:pointer;
    width:28px;
    height:28px;
    flex-shrink:0;
  }
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    padding-top:10px;
    flex-shrink:0;
  }
  .chip{
    border:none;
    border-radius:999px;
    padding:6px 12px;
    font-size:12px;
    color:var(--num);
    background:var(--bg);
    cursor:pointer;
  }
  #appt-form{
    display:flex;
    gap:8px;
    padding-top:12px;
    flex-shrink:0;
  }
  #appt-form input[type="time"]{
    width:100px;
    border:1px solid #ddd;
    border-radius:10px;
    padding:8px;
    font-size:14px;
    background:var(--bg);
  }
  #appt-form input[type="text"]{
    flex:1;
    min-width:0;
    border:1px solid #ddd;
    border-radius:10px;
    padding:8px 10px;
    font-size:14px;
    background:var(--bg);
  }
  #appt-form button{
    width:38px;
    height:38px;
    border-radius:50%;
    border:none;
    background:var(--header);
    color:#fff;
    font-size:20px;
    cursor:pointer;
    flex-shrink:0;
  }
  #report-list{
    list-style:none;
    margin:0;
    padding:0;
    overflow-y:auto;
    flex:1;
  }
  #report-list li{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid #eee;
    font-size:14px;
    color:var(--num);
    line-height:1.4;
  }
  #report-list .dot{
    width:9px;
    height:9px;
    flex-shrink:0;
  }
</style>
</head>
<body>
  <header>
    <button id="prev" aria-label="Previous month">&#8249;</button>
    <div class="header-center">
      <h1 id="label"></h1>
      <button id="bell-btn" class="bell-btn" aria-label="Reminders">
        <svg viewBox="0 0 24 24"><path d="M12 2a1 1 0 0 0-1 1v1.06A7 7 0 0 0 5 11v4l-1.7 2.55A1 1 0 0 0 4 19h16a1 1 0 0 0 .8-1.45L19 15v-4a7 7 0 0 0-6-6.94V3a1 1 0 0 0-1-1zm0 20a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22z"/></svg>
      </button>
      <button id="report-btn" class="bell-btn" aria-label="Report">
        <svg viewBox="0 0 24 24"><rect x="3" y="10" width="4" height="11" rx="1"/><rect x="10" y="5" width="4" height="16" rx="1"/><rect x="17" y="13" width="4" height="8" rx="1"/></svg>
      </button>
    </div>
    <button id="next" aria-label="Next month">&#8250;</button>
  </header>
  <div class="weekdays">
    <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
  </div>
  <div class="grid" id="grid"></div>

  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-top">
      <h2 id="sheet-date"></h2>
      <div class="sheet-actions">
        <button id="notes-btn" class="icon-btn notes-icon" aria-label="Notes"></button>
        <button class="sheet-close" id="sheet-close" aria-label="Close">&times;</button>
      </div>
    </div>
    <div id="main-view">
      <div class="log-row">
        <button id="log-btn" class="log-btn" aria-label="Log"></button>
      </div>
      <ul id="appt-list"></ul>
      <div class="chip-row" id="preset-chips"></div>
      <form id="appt-form">
        <input type="time" id="appt-time" required />
        <input type="text" id="appt-name" placeholder="Appointment" required />
        <button type="submit" aria-label="Add">+</button>
      </form>
    </div>
    <div id="notes-view" hidden>
      <button id="notes-back" class="icon-btn" aria-label="Back">&#8249;</button>
      <div id="lock-panel">
        <input id="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" />
        <p id="pin-hint"></p>
        <button id="forgot-btn" type="button">&#8635;</button>
      </div>
      <textarea id="notes-text" hidden></textarea>
    </div>
  </div>

  <div class="dialog-backdrop" id="log-backdrop"></div>
  <div class="dialog" id="log-dialog">
    <div class="swatches">
      <button class="swatch red" data-color="binge" aria-label="Red"></button>
      <button class="swatch pink" data-color="pink" aria-label="Pink"></button>
      <button class="swatch amber" data-color="amber" aria-label="Amber"></button>
      <button class="swatch green" data-color="green" aria-label="Green"></button>
      <button class="swatch blue" data-color="blue" aria-label="Blue"></button>
      <button class="swatch black" data-color="black" aria-label="Black"></button>
    </div>
    <div class="tally" id="log-tally"></div>
  </div>

  <div class="backdrop" id="reminders-backdrop"></div>
  <div class="sheet" id="reminders-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-top">
      <span></span>
      <button class="sheet-close" id="reminders-close" aria-label="Close">&times;</button>
    </div>
    <ul id="reminder-list"></ul>
    <form id="reminder-form">
      <input type="text" id="reminder-text" placeholder="Reminder" required />
      <button type="submit" aria-label="Add">+</button>
    </form>
  </div>

  <div class="backdrop" id="report-backdrop"></div>
  <div class="sheet" id="report-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-top">
      <span></span>
      <button class="sheet-close" id="report-close" aria-label="Close">&times;</button>
    </div>
    <ul id="report-list"></ul>
  </div>

<script>
  var view = new Date();
  view.setDate(1);
  var selectedKey = null;

  var label = document.getElementById('label');
  var grid = document.getElementById('grid');
  var backdrop = document.getElementById('backdrop');
  var sheet = document.getElementById('sheet');
  var sheetDate = document.getElementById('sheet-date');
  var apptList = document.getElementById('appt-list');
  var apptForm = document.getElementById('appt-form');
  var apptTime = document.getElementById('appt-time');
  var apptName = document.getElementById('appt-name');
  var presetChips = document.getElementById('preset-chips');
  var logBtn = document.getElementById('log-btn');
  var logBackdrop = document.getElementById('log-backdrop');
  var logDialog = document.getElementById('log-dialog');
  var logTally = document.getElementById('log-tally');
  var bellBtn = document.getElementById('bell-btn');
  var remindersBackdrop = document.getElementById('reminders-backdrop');
  var remindersSheet = document.getElementById('reminders-sheet');
  var reminderList = document.getElementById('reminder-list');
  var reminderForm = document.getElementById('reminder-form');
  var reminderText = document.getElementById('reminder-text');
  var reportBtn = document.getElementById('report-btn');
  var reportBackdrop = document.getElementById('report-backdrop');
  var reportSheet = document.getElementById('report-sheet');
  var reportList = document.getElementById('report-list');
  var mainView = document.getElementById('main-view');
  var notesView = document.getElementById('notes-view');
  var notesBtn = document.getElementById('notes-btn');
  var notesBack = document.getElementById('notes-back');
  var lockPanel = document.getElementById('lock-panel');
  var pinInput = document.getElementById('pin-input');
  var pinHint = document.getElementById('pin-hint');
  var forgotBtn = document.getElementById('forgot-btn');
  var notesText = document.getElementById('notes-text');

  var STORE_KEY = 'planner-appointments';
  var data = {};
  try{ data = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ data = {}; }

  var DOTS_KEY = 'planner-dots';
  var COLORS = ['binge','pink','amber','green','blue','black'];
  var dots = null;
  try{ dots = JSON.parse(localStorage.getItem(DOTS_KEY)); }catch(e){ dots = null; }
  if (!dots){
    dots = {};
    var oldBinges = null;
    try{ oldBinges = JSON.parse(localStorage.getItem('planner-binges')); }catch(e){ oldBinges = null; }
    if (oldBinges){
      Object.keys(oldBinges).forEach(function(k){ dots[k] = { binge: oldBinges[k] }; });
    }
  }

  var REMINDERS_KEY = 'planner-reminders';
  var reminders = [];
  try{ reminders = JSON.parse(localStorage.getItem(REMINDERS_KEY)) || []; }catch(e){ reminders = []; }

  var NOTES_KEY = 'planner-notes';
  var notesStore = {};
  try{ notesStore = JSON.parse(localStorage.getItem(NOTES_KEY)) || {}; }catch(e){ notesStore = {}; }

  var NOTES_META_KEY = 'planner-notes-meta';
  var notesMeta = null;
  try{ notesMeta = JSON.parse(localStorage.getItem(NOTES_META_KEY)) || null; }catch(e){ notesMeta = null; }

  var sessionKey = null;
  var pinMode = null;
  var pendingPin = null;
  var saveTimer = null;

  function save(){
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  }
  function saveDots(){
    localStorage.setItem(DOTS_KEY, JSON.stringify(dots));
  }
  function saveReminders(){
    localStorage.setItem(REMINDERS_KEY, JSON.stringify(reminders));
  }
  function saveNotesStore(){
    localStorage.setItem(NOTES_KEY, JSON.stringify(notesStore));
  }
  function saveNotesMeta(){
    localStorage.setItem(NOTES_META_KEY, JSON.stringify(notesMeta));
  }

  function toB64(buf){
    var bytes = new Uint8Array(buf), bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function fromB64(str){
    var bin = atob(str), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }
  function deriveKey(pin, saltB64){
    var enc = new TextEncoder();
    var salt = new Uint8Array(fromB64(saltB64));
    return crypto.subtle.importKey('raw', enc.encode(pin), {name:'PBKDF2'}, false, ['deriveKey'])
      .then(function(base){
        return crypto.subtle.deriveKey(
          { name:'PBKDF2', salt:salt, iterations:150000, hash:'SHA-256' },
          base,
          { name:'AES-GCM', length:256 },
          false,
          ['encrypt','decrypt']
        );
      });
  }
  function encryptText(key, text){
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, key, new TextEncoder().encode(text))
      .then(function(ct){ return { iv: toB64(iv), ct: toB64(ct) }; });
  }
  function decryptText(key, rec){
    var iv = new Uint8Array(fromB64(rec.iv));
    return crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, key, fromB64(rec.ct))
      .then(function(pt){ return new TextDecoder().decode(pt); });
  }
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function dateKey(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function formatTime(t){
    var parts = t.split(':');
    var h = parseInt(parts[0], 10);
    var m = parts[1];
    var suffix = h >= 12 ? 'PM' : 'AM';
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    return h12 + ':' + m + ' ' + suffix;
  }

  function render(){
    var year = view.getFullYear();
    var month = view.getMonth();
    label.textContent = view.toLocaleString('default',{month:'long'}) + ' ' + year;

    var first = new Date(year, month, 1);
    var startOffset = (first.getDay() + 6) % 7; // Monday = 0

    var today = new Date();

    grid.innerHTML = '';
    var totalCells = 42;
    for (var i = 0; i < totalCells; i++){
      var cellDate = new Date(year, month, i - startOffset + 1);
      var inMonth = cellDate.getMonth() === month;
      var key = dateKey(cellDate);

      var cell = document.createElement('div');
      cell.className = 'cell ' + (inMonth ? 'in' : 'out');
      if (cellDate.getFullYear() === today.getFullYear() &&
          cellDate.getMonth() === today.getMonth() &&
          cellDate.getDate() === today.getDate()){
        cell.className += ' today';
      }
      cell.dataset.key = key;

      var span = document.createElement('span');
      span.className = 'num';
      span.textContent = cellDate.getDate();
      cell.appendChild(span);

      var marks = document.createElement('div');
      marks.className = 'marks';
      if (data[key] && data[key].length){
        var dot = document.createElement('span');
        dot.className = 'dot';
        marks.appendChild(dot);
      }
      var dayDots = dots[key];
      if (dayDots){
        COLORS.forEach(function(color){
          var count = dayDots[color] || 0;
          for (var c = 0; c < count; c++){
            var cdot = document.createElement('span');
            cdot.className = 'dot ' + color;
            marks.appendChild(cdot);
          }
        });
      }
      if (notesStore[key]){
        var ndot = document.createElement('span');
        ndot.className = 'dot note';
        marks.appendChild(ndot);
      }
      if (marks.children.length) cell.appendChild(marks);

      cell.addEventListener('click', (function(d, k){
        return function(){
          if (d.getMonth() !== view.getMonth() || d.getFullYear() !== view.getFullYear()){
            view = new Date(d.getFullYear(), d.getMonth(), 1);
            render();
          }
          openSheet(k, d);
        };
      })(cellDate, key));

      grid.appendChild(cell);
    }
  }

  function openSheet(key, d){
    if (!notesText.hidden) saveCurrentNote();
    closeReminders();
    closeReport();
    selectedKey = key;
    sheetDate.textContent = d.toLocaleDateString('default',{weekday:'short', day:'numeric', month:'short'});
    renderAppts();
    notesView.hidden = true;
    mainView.hidden = false;
    backdrop.classList.add('open');
    sheet.classList.add('open');
    apptTime.value = '';
    apptName.value = '';
  }

  function closeSheet(){
    if (!notesText.hidden) saveCurrentNote();
    closeLogDialog();
    backdrop.classList.remove('open');
    sheet.classList.remove('open');
    selectedKey = null;
  }

  function openNotesView(){
    mainView.hidden = true;
    notesView.hidden = false;
    if (sessionKey){
      showNoteEditor();
    } else if (notesMeta){
      pinMode = 'unlock';
      showPinPrompt();
    } else {
      pinMode = 'create';
      pendingPin = null;
      showPinPrompt();
    }
  }

  function showPinPrompt(){
    notesText.hidden = true;
    lockPanel.hidden = false;
    pinInput.value = '';
    pinHint.textContent = pinMode === 'confirm' ? 'again' : '';
    pinInput.classList.remove('error');
    pinInput.focus();
  }

  function showNoteEditor(){
    lockPanel.hidden = true;
    notesText.hidden = false;
    var rec = notesStore[selectedKey];
    if (rec){
      decryptText(sessionKey, rec).then(function(text){
        notesText.value = text;
      }).catch(function(){
        notesText.value = '';
      });
    } else {
      notesText.value = '';
    }
    notesText.focus();
  }

  function saveCurrentNote(){
    if (!selectedKey || !sessionKey) return;
    var text = notesText.value;
    if (!text.trim()){
      if (notesStore[selectedKey]){
        delete notesStore[selectedKey];
        saveNotesStore();
        render();
      }
      return;
    }
    encryptText(sessionKey, text).then(function(rec){
      notesStore[selectedKey] = rec;
      saveNotesStore();
      render();
    });
  }

  function pinFail(){
    pinInput.classList.add('error');
    pinInput.value = '';
    setTimeout(function(){ pinInput.classList.remove('error'); }, 300);
  }

  notesBtn.addEventListener('click', openNotesView);
  notesBack.addEventListener('click', function(){
    if (!notesText.hidden) saveCurrentNote();
    notesView.hidden = true;
    mainView.hidden = false;
  });

  pinInput.addEventListener('input', function(){
    var val = pinInput.value.replace(/[^0-9]/g, '');
    pinInput.value = val;
    if (val.length !== 4) return;

    if (pinMode === 'create'){
      pendingPin = val;
      pinMode = 'confirm';
      showPinPrompt();
    } else if (pinMode === 'confirm'){
      if (val === pendingPin){
        var salt = toB64(crypto.getRandomValues(new Uint8Array(16)).buffer);
        deriveKey(val, salt).then(function(key){
          return encryptText(key, 'ok').then(function(check){
            notesMeta = { salt: salt, check: check };
            saveNotesMeta();
            sessionKey = key;
            showNoteEditor();
          });
        });
      } else {
        pinFail();
        pinMode = 'create';
        pendingPin = null;
      }
    } else if (pinMode === 'unlock'){
      deriveKey(val, notesMeta.salt).then(function(key){
        return decryptText(key, notesMeta.check).then(function(plain){
          if (plain === 'ok'){
            sessionKey = key;
            showNoteEditor();
          } else {
            pinFail();
          }
        });
      }).catch(function(){ pinFail(); });
    }
  });

  forgotBtn.addEventListener('click', function(){
    if (!confirm('Forgotten PIN deletes all notes. Continue?')) return;
    notesStore = {};
    notesMeta = null;
    sessionKey = null;
    saveNotesStore();
    localStorage.removeItem(NOTES_META_KEY);
    pinMode = 'create';
    pendingPin = null;
    showPinPrompt();
    render();
  });

  notesText.addEventListener('input', function(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveCurrentNote, 600);
  });

  var PRESETS = ['Pilates', 'Walk', 'The PMDD Project', 'Rex', 'Health'];
  PRESETS.forEach(function(name){
    var chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip';
    chip.textContent = name;
    chip.addEventListener('click', function(){
      apptName.value = name;
      apptTime.focus();
    });
    presetChips.appendChild(chip);
  });

  function renderAppts(){
    apptList.innerHTML = '';
    var items = (data[selectedKey] || []).slice().sort(function(a,b){
      return a.time < b.time ? -1 : a.time > b.time ? 1 : 0;
    });
    items.forEach(function(item, idx){
      var li = document.createElement('li');

      var time = document.createElement('span');
      time.className = 'time';
      time.textContent = formatTime(item.time);

      var name = document.createElement('span');
      name.className = 'name';
      name.textContent = item.name;

      var remove = document.createElement('button');
      remove.className = 'remove';
      remove.type = 'button';
      remove.innerHTML = '&times;';
      remove.addEventListener('click', function(){
        var arr = data[selectedKey];
        var realIdx = arr.indexOf(item);
        arr.splice(realIdx, 1);
        if (!arr.length) delete data[selectedKey];
        save();
        renderAppts();
        render();
      });

      li.appendChild(time);
      li.appendChild(name);
      li.appendChild(remove);
      apptList.appendChild(li);
    });
  }

  function renderTally(){
    logTally.innerHTML = '';
    var dayDots = dots[selectedKey] || {};
    COLORS.forEach(function(color){
      var count = dayDots[color] || 0;
      for (var i = 0; i < count; i++){
        var d = document.createElement('span');
        d.className = 'dot ' + color;
        d.addEventListener('click', (function(color){
          return function(){
            var entry = dots[selectedKey];
            if (!entry) return;
            entry[color] = Math.max(0, (entry[color] || 0) - 1);
            if (!entry[color]) delete entry[color];
            if (!Object.keys(entry).length) delete dots[selectedKey];
            saveDots();
            renderTally();
            render();
          };
        })(color));
        logTally.appendChild(d);
      }
    });
  }

  function openLogDialog(){
    if (!selectedKey) return;
    renderTally();
    logBackdrop.classList.add('open');
    logDialog.classList.add('open');
  }
  function closeLogDialog(){
    logBackdrop.classList.remove('open');
    logDialog.classList.remove('open');
  }

  logBtn.addEventListener('click', openLogDialog);
  logBackdrop.addEventListener('click', closeLogDialog);

  document.querySelectorAll('.swatch').forEach(function(btn){
    btn.addEventListener('click', function(){
      if (!selectedKey) return;
      var color = btn.dataset.color;
      if (!dots[selectedKey]) dots[selectedKey] = {};
      dots[selectedKey][color] = (dots[selectedKey][color] || 0) + 1;
      saveDots();
      renderTally();
      render();
    });
  });

  function updateBellState(){
    var active = reminders.some(function(r){ return !r.done; });
    bellBtn.classList.toggle('active', active);
  }

  function renderReminders(){
    reminderList.innerHTML = '';
    reminders.forEach(function(item){
      var li = document.createElement('li');
      if (item.done) li.className = 'done';

      var check = document.createElement('input');
      check.type = 'checkbox';
      check.checked = item.done;
      check.addEventListener('change', function(){
        item.done = check.checked;
        saveReminders();
        renderReminders();
        updateBellState();
      });

      var text = document.createElement('span');
      text.className = 'rtext';
      text.textContent = item.text;

      var remove = document.createElement('button');
      remove.className = 'remove';
      remove.type = 'button';
      remove.innerHTML = '&times;';
      remove.addEventListener('click', function(){
        reminders = reminders.filter(function(r){ return r.id !== item.id; });
        saveReminders();
        renderReminders();
        updateBellState();
      });

      li.appendChild(check);
      li.appendChild(text);
      li.appendChild(remove);
      reminderList.appendChild(li);
    });
  }

  function openReminders(){
    closeSheet();
    closeReport();
    renderReminders();
    remindersBackdrop.classList.add('open');
    remindersSheet.classList.add('open');
    reminderText.value = '';
  }
  function closeReminders(){
    remindersBackdrop.classList.remove('open');
    remindersSheet.classList.remove('open');
  }

  bellBtn.addEventListener('click', openReminders);
  document.getElementById('reminders-close').addEventListener('click', closeReminders);
  remindersBackdrop.addEventListener('click', closeReminders);

  reminderForm.addEventListener('submit', function(e){
    e.preventDefault();
    var text = reminderText.value.trim();
    if (!text) return;
    reminders.push({ id: crypto.randomUUID(), text: text, done: false });
    saveReminders();
    reminderText.value = '';
    renderReminders();
    updateBellState();
  });

  var COLOR_LABEL = { binge:'red', pink:'pink', amber:'amber', green:'green', blue:'blue', black:'black' };
  var WEEKDAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  function parseKey(key){
    var parts = key.split('-');
    return new Date(parseInt(parts[0],10), parseInt(parts[1],10) - 1, parseInt(parts[2],10));
  }

  function computeReport(){
    var MIN_TOTAL = 7, MIN_GROUP = 4, THRESHOLD = 0.25;

    var allKeys = {};
    Object.keys(data).forEach(function(k){ if (data[k] && data[k].length) allKeys[k] = 1; });
    Object.keys(dots).forEach(function(k){ if (dots[k] && Object.keys(dots[k]).length) allKeys[k] = 1; });
    Object.keys(notesStore).forEach(function(k){ allKeys[k] = 1; });
    var keys = Object.keys(allKeys);
    if (!keys.length) return null;

    var parsedDates = keys.map(parseKey);
    var min = new Date(Math.min.apply(null, parsedDates));
    var max = new Date(Math.max.apply(null, parsedDates));

    var days = [];
    var cur = new Date(min.getFullYear(), min.getMonth(), min.getDate());
    while (cur <= max){
      var k = dateKey(cur);
      days.push({
        apptCount: (data[k] || []).length,
        apptNames: (data[k] || []).map(function(a){ return a.name; }),
        dotCounts: dots[k] || {},
        weekday: cur.getDay()
      });
      cur.setDate(cur.getDate() + 1);
    }
    if (days.length < MIN_TOTAL) return null;

    function hasColor(day, color){ return (day.dotCounts[color] || 0) > 0; }

    var conditions = [];
    var maxAppt = 0;
    days.forEach(function(d){ if (d.apptCount > maxAppt) maxAppt = d.apptCount; });
    for (var n = 0; n <= Math.min(maxAppt, 4); n++){
      conditions.push({
        test: (function(n){ return function(d){ return d.apptCount === n; }; })(n),
        phrase: n === 0 ? 'you have no appointments' : 'you have exactly ' + n + (n === 1 ? ' appointment' : ' appointments')
      });
    }
    if (maxAppt >= 2) conditions.push({ test: function(d){ return d.apptCount >= 2; }, phrase: 'you have 2 or more appointments' });
    if (maxAppt >= 3) conditions.push({ test: function(d){ return d.apptCount >= 3; }, phrase: 'you have 3 or more appointments' });
    if (maxAppt >= 5) conditions.push({ test: function(d){ return d.apptCount >= 5; }, phrase: 'you have 5 or more appointments' });
    WEEKDAY_NAMES.forEach(function(name, idx){
      conditions.push({ test: function(d){ return d.weekday === idx; }, phrase: "it's a " + name });
    });
    COLORS.forEach(function(c){
      conditions.push({ test: function(d){ return hasColor(d, c); }, phrase: 'you have a ' + COLOR_LABEL[c] + ' dot', color: c });
    });
    var apptNamesSeen = {};
    days.forEach(function(d){ d.apptNames.forEach(function(n){ apptNamesSeen[n] = true; }); });
    Object.keys(apptNamesSeen).forEach(function(name){
      conditions.push({
        test: function(d){ return d.apptNames.indexOf(name) >= 0; },
        phrase: 'you have a ' + name + ' appointment'
      });
    });

    var candidates = [];
    conditions.forEach(function(cond){
      var inGroup = days.filter(cond.test);
      var outGroup = days.filter(function(d){ return !cond.test(d); });
      if (inGroup.length < MIN_GROUP || outGroup.length < MIN_GROUP) return;
      COLORS.forEach(function(outColor){
        if (cond.color === outColor) return;
        var rateIn = inGroup.filter(function(d){ return hasColor(d, outColor); }).length / inGroup.length;
        var rateOut = outGroup.filter(function(d){ return hasColor(d, outColor); }).length / outGroup.length;
        var diff = rateIn - rateOut;
        if (Math.abs(diff) >= THRESHOLD){
          candidates.push({ diff: diff, rateIn: rateIn, nIn: inGroup.length, phrase: cond.phrase, color: outColor });
        }
      });
    });

    candidates.sort(function(a, b){ return Math.abs(b.diff) - Math.abs(a.diff); });
    return candidates.slice(0, 6);
  }

  function renderReport(){
    reportList.innerHTML = '';
    var candidates = computeReport();

    if (!candidates){
      var li = document.createElement('li');
      li.textContent = 'Not enough data yet.';
      reportList.appendChild(li);
      return;
    }
    if (!candidates.length){
      var li2 = document.createElement('li');
      li2.textContent = 'No clear patterns yet.';
      reportList.appendChild(li2);
      return;
    }
    candidates.forEach(function(c){
      var li = document.createElement('li');
      var dot = document.createElement('span');
      dot.className = 'dot ' + c.color;
      var text = document.createElement('span');
      var label = COLOR_LABEL[c.color];
      var article = /^[aeiou]/i.test(label) ? 'an' : 'a';
      var sentence;
      if (c.rateIn >= 0.999 && c.nIn >= 3){
        sentence = 'You always have ' + article + ' ' + label + ' dot when ' + c.phrase + '.';
      } else if (c.rateIn <= 0.001 && c.nIn >= 3){
        sentence = 'You never have ' + article + ' ' + label + ' dot when ' + c.phrase + '.';
      } else if (c.diff > 0){
        sentence = "You're more likely to have " + article + ' ' + label + ' dot when ' + c.phrase + '.';
      } else {
        sentence = "You're less likely to have " + article + ' ' + label + ' dot when ' + c.phrase + '.';
      }
      text.textContent = sentence;
      li.appendChild(dot);
      li.appendChild(text);
      reportList.appendChild(li);
    });
  }

  function openReport(){
    closeSheet();
    closeReminders();
    renderReport();
    reportBackdrop.classList.add('open');
    reportSheet.classList.add('open');
  }
  function closeReport(){
    reportBackdrop.classList.remove('open');
    reportSheet.classList.remove('open');
  }

  reportBtn.addEventListener('click', openReport);
  document.getElementById('report-close').addEventListener('click', closeReport);
  reportBackdrop.addEventListener('click', closeReport);

  apptForm.addEventListener('submit', function(e){
    e.preventDefault();
    if (!selectedKey || !apptTime.value || !apptName.value.trim()) return;
    if (!data[selectedKey]) data[selectedKey] = [];
    data[selectedKey].push({ time: apptTime.value, name: apptName.value.trim() });
    save();
    apptTime.value = '';
    apptName.value = '';
    renderAppts();
    render();
  });

  document.getElementById('prev').addEventListener('click', function(){
    view.setMonth(view.getMonth() - 1);
    render();
  });
  document.getElementById('next').addEventListener('click', function(){
    view.setMonth(view.getMonth() + 1);
    render();
  });
  label.addEventListener('click', function(){
    view = new Date();
    view.setDate(1);
    render();
  });
  document.getElementById('sheet-close').addEventListener('click', closeSheet);
  backdrop.addEventListener('click', closeSheet);

  var touchX = null;
  document.body.addEventListener('touchstart', function(e){
    if (sheet.classList.contains('open')) return;
    touchX = e.changedTouches[0].clientX;
  });
  document.body.addEventListener('touchend', function(e){
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 60){
      view.setMonth(view.getMonth() + (dx < 0 ? 1 : -1));
      render();
    }
    touchX = null;
  });

  updateBellState();
  render();
</script>
</body>
