<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Planner</title>
<meta name="theme-color" content="#35476b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Planner" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2335476b'/%3E%3Crect x='18' y='18' width='64' height='64' rx='10' fill='%23f4f1ec'/%3E%3Crect x='18' y='18' width='64' height='20' rx='10' fill='%23c04863'/%3E%3Crect x='18' y='28' width='64' height='10' fill='%23c04863'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2335476b'/%3E%3Crect x='18' y='18' width='64' height='64' rx='10' fill='%23f4f1ec'/%3E%3Crect x='18' y='18' width='64' height='20' rx='10' fill='%23c04863'/%3E%3Crect x='18' y='28' width='64' height='10' fill='%23c04863'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#f4f1ec;
    --header:#35476b;
    --header-text:#f4f1ec;
    --today:#c04863;
    --grid-line:#e5e0d8;
    --num:#3c3c3c;
    --mon:#b7cbe0;
    --tue:#b3cdcb;
    --wed:#bcaebb;
    --thu:#a6aed6;
    --fri:#e6b7c1;
    --sat:#e8b9c3;
    --sun:#d7cdc4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%;
    margin:0;
    overscroll-behavior:none;
    touch-action:manipulation;
  }
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    flex-direction:column;
    height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    user-select:none;
  }
  header{
    background:var(--header);
    color:var(--header-text);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 8px;
    flex-shrink:0;
  }
  header button{
    background:none;
    border:none;
    color:var(--header-text);
    font-size:22px;
    width:44px;
    height:44px;
    line-height:44px;
    cursor:pointer;
  }
  header h1{
    margin:0;
    font-size:17px;
    font-weight:600;
    letter-spacing:.02em;
    cursor:pointer;
  }
  .weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    flex-shrink:0;
  }
  .weekdays span{
    text-align:center;
    font-size:11px;
    font-weight:600;
    color:#8b8b8b;
    padding:6px 0;
  }
  .grid{
    flex:1;
    display:grid;
    grid-template-columns:repeat(7,1fr);
    grid-template-rows:repeat(6,1fr);
    gap:2px;
    padding:2px;
    min-height:0;
  }
  .cell{
    position:relative;
    display:flex;
    align-items:flex-start;
    justify-content:flex-end;
    padding:6px;
    border-radius:10px;
    background:var(--bg);
  }
  .cell.in span{color:var(--num);}
  .cell.out{opacity:.35;}
  .cell:nth-child(7n+1){background:var(--mon);}
  .cell:nth-child(7n+2){background:var(--tue);}
  .cell:nth-child(7n+3){background:var(--wed);}
  .cell:nth-child(7n+4){background:var(--thu);}
  .cell:nth-child(7n+5){background:var(--fri);}
  .cell:nth-child(7n+6){background:var(--sat);}
  .cell:nth-child(7n+7){background:var(--sun);}
  .cell span{
    font-size:14px;
    font-weight:500;
    width:24px;
    height:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
  }
  .cell.today span{
    background:var(--today);
    color:#fff;
    font-weight:700;
  }
</style>
</head>
<body>
  <header>
    <button id="prev" aria-label="Previous month">&#8249;</button>
    <h1 id="label"></h1>
    <button id="next" aria-label="Next month">&#8250;</button>
  </header>
  <div class="weekdays">
    <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
  </div>
  <div class="grid" id="grid"></div>

<script>
  var view = new Date();
  view.setDate(1);

  var label = document.getElementById('label');
  var grid = document.getElementById('grid');

  function render(){
    var year = view.getFullYear();
    var month = view.getMonth();
    label.textContent = view.toLocaleString('default',{month:'long'}) + ' ' + year;

    var first = new Date(year, month, 1);
    var startOffset = (first.getDay() + 6) % 7; // Monday = 0
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var daysInPrev = new Date(year, month, 0).getDate();

    var today = new Date();
    var isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;

    grid.innerHTML = '';
    var totalCells = 42;
    for (var i = 0; i < totalCells; i++){
      var dayNum, inMonth;
      if (i < startOffset){
        dayNum = daysInPrev - startOffset + i + 1;
        inMonth = false;
      } else if (i >= startOffset + daysInMonth){
        dayNum = i - startOffset - daysInMonth + 1;
        inMonth = false;
      } else {
        dayNum = i - startOffset + 1;
        inMonth = true;
      }
      var cell = document.createElement('div');
      cell.className = 'cell ' + (inMonth ? 'in' : 'out');
      if (inMonth && isCurrentMonth && dayNum === today.getDate()){
        cell.className += ' today';
      }
      var span = document.createElement('span');
      span.textContent = dayNum;
      cell.appendChild(span);
      grid.appendChild(cell);
    }
  }

  document.getElementById('prev').addEventListener('click', function(){
    view.setMonth(view.getMonth() - 1);
    render();
  });
  document.getElementById('next').addEventListener('click', function(){
    view.setMonth(view.getMonth() + 1);
    render();
  });
  label.addEventListener('click', function(){
    view = new Date();
    view.setDate(1);
    render();
  });

  var touchX = null;
  document.body.addEventListener('touchstart', function(e){
    touchX = e.changedTouches[0].clientX;
  });
  document.body.addEventListener('touchend', function(e){
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 60){
      view.setMonth(view.getMonth() + (dx < 0 ? 1 : -1));
      render();
    }
    touchX = null;
  });

  render();
</script>
</body>
</html>
