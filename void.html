<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Void | She's Unbelievable</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    #bg-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #ui {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      padding: 0 24px 48px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #thought-input {
      width: 100%;
      padding: 18px 20px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
      resize: none;
      height: 58px;
      line-height: 22px;
      overflow: hidden;
    }

    #thought-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    #thought-input:focus {
      border-color: rgba(255, 255, 255, 0.45);
    }

    #release-btn {
      width: 100%;
      padding: 18px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: background 0.2s, transform 0.1s;
    }

    #release-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    #release-btn:active {
      transform: scale(0.97);
    }

    #release-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .thought-card {
      position: fixed;
      z-index: 20;
      max-width: 200px;
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(10, 10, 20, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
      text-align: center;
      pointer-events: none;
      transform-origin: center center;
    }

    #ui {
      animation: fadeUp 0.8s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Hamburger button ── */
    #menu-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 50;
      background: rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 10px;
      width: 40px;
      height: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      padding: 0;
    }

    .burger-line {
      width: 17px;
      height: 1.5px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 2px;
    }

    /* ── Backdrop ── */
    #menu-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(0, 0, 0, 0.28);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    #menu-backdrop.open {
      opacity: 1;
      pointer-events: all;
    }

    /* ── Drawer ── */
    #menu-drawer {
      position: fixed;
      top: 0;
      left: -230px;
      width: 210px;
      height: 100%;
      z-index: 45;
      background: rgba(4, 4, 10, 0.9);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      padding: 64px 0 32px;
      transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #menu-drawer.open { left: 0; }

    .menu-section-label {
      font-size: 0.62rem;
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 0 20px 8px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 20px;
      color: rgba(255, 255, 255, 0.65);
      font-size: 15px;
      font-family: inherit;
      text-decoration: none;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: background 0.15s, color 0.15s;
    }

    .menu-item:hover { background: rgba(255,255,255,0.06); color: #fff; }

    .menu-item.active {
      color: #fff;
      border-left-color: rgba(255, 255, 255, 0.45);
    }

    .menu-divider {
      height: 1px;
      margin: 12px 20px;
      background: rgba(255, 255, 255, 0.08);
    }

    /* Suppress PiP and media overlay */
    #bg-video::-webkit-media-controls { display: none !important; }
    #bg-video { -webkit-touch-callout: none; }
  </style>
</head>
<body>

  <button id="menu-btn" aria-label="Menu">
    <span class="burger-line"></span>
    <span class="burger-line"></span>
    <span class="burger-line"></span>
  </button>

  <div id="menu-backdrop"></div>

  <nav id="menu-drawer">
    <div class="menu-section-label">Videos</div>
    <a class="menu-item active" href="#" data-v="galaxy">Galaxy</a>
    <a class="menu-item" href="#" data-v="whirlpool">Whirlpool</a>
    <a class="menu-item" href="#" data-v="fire">Fire</a>
    <a class="menu-item" href="#" data-v="lightning">Lightning</a>
    <div class="menu-divider"></div>
    <div class="menu-section-label">Site</div>
    <a class="menu-item" href="index.html">&larr; Thousands Wouldn&rsquo;t</a>
  </nav>

  <div id="video-container">
    <video id="bg-video" autoplay muted loop playsinline disablepictureinpicture x-webkit-airplay="deny"></video>
  </div>

  <div id="ui">
    <input
      id="thought-input"
      type="text"
      placeholder="What's on your mind?"
      maxlength="200"
      autocomplete="off"
      spellcheck="false"
    />
    <button id="release-btn">Release</button>
  </div>

  <script>
    const input = document.getElementById('thought-input');
    const btn   = document.getElementById('release-btn');

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); release(); }
    });

    btn.addEventListener('click', release);

    function release() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      btn.disabled = true;
      if (vKey === 'lightning') animateLightning(text);
      else animateVoid(text);
    }

    function animateVoid(text) {
      const card = document.createElement('div');
      card.className = 'thought-card';
      card.textContent = text;
      document.body.appendChild(card);

      const startX = window.innerWidth  / 2 - 100;
      const startY = window.innerHeight * 0.62;
      card.style.left = startX + 'px';
      card.style.top  = startY + 'px';

      const targetX = window.innerWidth  / 2;
      const targetY = window.innerHeight * 0.38;
      const duration = 1800;
      let start = null;

      function step(ts) {
        if (!start) start = ts;
        const t = Math.min((ts - start) / duration, 1);
        const ease = t * t * t;
        const x = startX + (targetX - startX - 100) * ease;
        const y = startY + (targetY - startY) * ease;
        card.style.left      = x + 'px';
        card.style.top       = y + 'px';
        card.style.transform = `rotate(${ease * 720}deg) scale(${Math.max(1 - ease * 0.92, 0.08)})`;
        card.style.opacity   = Math.max(1 - ease * 1.2, 0);
        if (t < 1) requestAnimationFrame(step);
        else { card.remove(); btn.disabled = false; input.focus(); }
      }
      requestAnimationFrame(step);
    }

    function animateLightning(text) {
      const words = text.trim().split(/\s+/).filter(Boolean);
      const cx = window.innerWidth  / 2;
      const cy = window.innerHeight * 0.62;

      // Screen flash — pale electric blue-white
      const flash = document.createElement('div');
      flash.style.cssText = 'position:fixed;inset:0;z-index:100;pointer-events:none;background:rgba(210,230,255,0.9);opacity:0;transition:opacity 0.04s ease-in';
      document.body.appendChild(flash);
      requestAnimationFrame(() => {
        flash.style.opacity = '1';
        setTimeout(() => {
          flash.style.transition = 'opacity 0.55s ease-out';
          flash.style.opacity = '0';
          setTimeout(() => flash.remove(), 650);
        }, 55);
      });

      // Burst words after flash peak
      setTimeout(() => {
        const total = words.length;
        words.forEach((word, i) => {
          const el = document.createElement('span');
          el.textContent = word;
          el.style.cssText = `
            position:fixed;z-index:20;
            left:${cx}px;top:${cy}px;
            color:#fff;font-size:16px;
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
            font-weight:500;white-space:nowrap;
            text-shadow:0 0 6px #b8d8ff,0 0 18px #70a8ff,0 0 40px rgba(80,140,255,0.55);
            pointer-events:none;transform-origin:center;
          `;
          document.body.appendChild(el);

          // Spread evenly around 360°, with a little randomness
          const baseAngle = (2 * Math.PI * i / total) - Math.PI / 2;
          const angle  = baseAngle + (Math.random() * 0.5 - 0.25);
          const dist   = 160 + Math.random() * 220;
          const dx     = Math.cos(angle) * dist;
          const dy     = Math.sin(angle) * dist - 60; // upward bias
          const spin   = (Math.random() - 0.5) * 480;
          const dur    = 650 + Math.random() * 350;

          let start = null;
          function step(ts) {
            if (!start) start = ts;
            const t = Math.min((ts - start) / dur, 1);
            const e = 1 - (1 - t) * (1 - t); // ease-out quad
            el.style.left      = (cx + dx * e) + 'px';
            el.style.top       = (cy + dy * e) + 'px';
            el.style.transform = `rotate(${spin * e}deg) scale(${1 + e * 0.25})`;
            el.style.opacity   = t < 0.15 ? '1' : String(Math.max(1 - (t - 0.15) / 0.85, 0));
            if (t < 1) requestAnimationFrame(step);
            else el.remove();
          }
          requestAnimationFrame(step);
        });

        // Re-enable after longest word finishes
        setTimeout(() => { btn.disabled = false; input.focus(); }, 1100);
      }, 45);
    }

    // ── Video selection ──
    const VIDEOS = {
      galaxy:    './videos/galaxy.mp4',
      whirlpool: './videos/whirlpool.mp4',
      fire:      './videos/fire.mp4',
      lightning: './videos/lightning.mp4',
    };

    let vKey      = 'galaxy';
    const bgVideo = document.getElementById('bg-video');

    function loadVideo(key) {
      vKey = key;
      bgVideo.src = VIDEOS[key] || VIDEOS.galaxy;
      bgVideo.load();
      bgVideo.play().catch(() => {});
      document.querySelectorAll('.menu-item[data-v]').forEach(item => {
        item.classList.toggle('active', item.dataset.v === key);
      });
    }

    loadVideo('galaxy');

    // ── Menu ──
    const menuBtn      = document.getElementById('menu-btn');
    const menuDrawer   = document.getElementById('menu-drawer');
    const menuBackdrop = document.getElementById('menu-backdrop');

    function openMenu()  { menuDrawer.classList.add('open'); menuBackdrop.classList.add('open'); }
    function closeMenu() { menuDrawer.classList.remove('open'); menuBackdrop.classList.remove('open'); }

    menuBtn.addEventListener('click', () => menuDrawer.classList.contains('open') ? closeMenu() : openMenu());
    menuBackdrop.addEventListener('click', closeMenu);

    document.querySelectorAll('.menu-item[data-v]').forEach(item => {
      item.addEventListener('click', e => {
        e.preventDefault();
        loadVideo(item.dataset.v || 'galaxy');
        closeMenu();
      });
    });
  </script>
</body>
</html>
